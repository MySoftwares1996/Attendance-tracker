name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      promote_tag:
        description: "Confirmed test build to send to phones over the air (e.g. v1.0.14). Leave empty to just build."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Sends an already-tested build to phones. Run ONLY after the owner confirms the build.
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.promote_tag }}
    steps:
      - name: Promote confirmed test build to OTA release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest \
            --title "Attendance Tracker ${TAG#v}"
          echo "Phones will now receive $TAG over the air."

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_tag == ''
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Optional override, e.g. a public URL if this repo stays private.
      UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5

      - name: Load release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set - APK is debug-signed and OTA releases are skipped."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Show OTA update URL setting
        run: |
          echo "OTA manifest URL override = '${UPDATE_MANIFEST_URL}' (blank means this repo's latest release)"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          # Fail the build if the OTA URL did not make it into the app.
          grep 'UPDATE_MANIFEST_URL' app/build/generated/source/buildConfig/release/com/attendance/tracker/BuildConfig.java
          grep -q 'UPDATE_MANIFEST_URL = "https://' app/build/generated/source/buildConfig/release/com/attendance/tracker/BuildConfig.java
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AttendanceTracker.apk

      # Non-fatal: the account's Actions artifact storage quota may be full.
      # The OTA release below (GitHub Releases) is the main delivery channel.
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: AttendanceTracker-apk
          path: dist/AttendanceTracker.apk
          retention-days: 7

      # Every successful build on the default branch is published straight to phones (OTA).
      # It only gets here if unit tests passed, the APK built, it is signed with the release
      # key and the OTA URL is baked in. (The "promote" job is kept for re-publishing an
      # older build manually if ever needed.)
      - name: Publish OTA release
        if: >-
          env.SIGNED == 'true' && (
            (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
            github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${BUILD_NUMBER}"
          TAG="v${VERSION}"
          SHA=$(sha256sum dist/AttendanceTracker.apk | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AttendanceTracker.apk"
          NOTES=$(git log -1 --pretty=%s)
          jq -n --argjson code "$BUILD_NUMBER" --arg name "$VERSION" --arg url "$URL" \
                --arg sha "$SHA" --arg notes "$NOTES" \
                '{versionCode:$code, versionName:$name, apkUrl:$url, sha256:$sha, notes:$notes}' > dist/update.json
          cat dist/update.json
          gh release create "$TAG" dist/AttendanceTracker.apk dist/update.json \
            --title "Attendance Tracker $VERSION" --notes "$NOTES" \
            --target "$GITHUB_SHA" --latest
